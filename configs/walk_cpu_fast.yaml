# CPU 版 walk 第二階段：把速度範圍放寬到 PRD 的完整範圍（1.5 m/s）。
# 從已經會走 1.0 m/s 的策略接著練（課程學習：先慢後快）：
#   python -m robodog.train configs/walk_cpu_fast.yaml --resume runs/walk/<第一階段的 run>
task: walk
seed: 1
domain_randomization: false

env:
  impl: jax
  command_config:
    a: [1.5, 0.8, 1.2]        # PRD 的完整範圍（和 walk.yaml 相同）
  reward_config:
    scales:                   # 和 walk_cpu.yaml 相同
      tracking_lin_vel: 2.0
      tracking_ang_vel: 1.0
      pose: 0.1
      feet_air_time: 0.5
      feet_clearance: -0.5
      energy: -0.0005

ppo:
  num_timesteps: 10000000
  num_evals: 6
  num_envs: 256
  num_eval_envs: 64
  batch_size: 256
  num_minibatches: 8
  num_updates_per_batch: 4
  unroll_length: 20
  learning_rate: 0.0002       # 接續訓練，學習率小一點，避免把已學會的忘掉
  entropy_cost: 0.005
  discounting: 0.97
  reward_scaling: 1.0
  max_grad_norm: 1.0
  normalize_observations: true
  num_resets_per_eval: 0
  action_repeat: 1
  network:
    policy_hidden_layer_sizes: [512, 256, 128]
    value_hidden_layer_sizes: [512, 256, 128]
    policy_obs_key: state
    value_obs_key: privileged_state
