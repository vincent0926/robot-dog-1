# 沒有 GPU 時的站起訓練（例如雲端 4 核 CPU）。
#   python -m robodog.train configs/getup_cpu.yaml
# 站起要算全身碰撞，4 核 CPU 只有約 500 steps/s，600 萬步約 3.5 小時。
# 有 GPU 請用 getup.yaml（5,000 萬步）。
task: getup
seed: 0
domain_randomization: false

env:
  impl: jax
  # 第一次用預設 reward 在 CPU 上練 170 萬步：學會把身體翻正，但一直趴著不站起來（成功率 0%）。
  # 原因：站高的獎勵差距小（趴著 0.11、站直 0.32），而起身時腿要甩，關節速度懲罰
  # 會讓每一步總分變負、被截成 0，策略感覺不到「站起來」的好處。所以這裡：
  reward_config:
    scales:
      torso_height: 3.0       # 預設 1.0：站高一點的好處放大
      dof_vel: -0.01          # 預設 -0.1：甩腿起身不要被重罰
      dof_acc: -0.0000001     # 預設 -2.5e-7

ppo:
  num_timesteps: 6000000
  num_evals: 12
  num_envs: 128
  num_eval_envs: 32
  batch_size: 128
  num_minibatches: 8          # 128 × 8 = 1024，是 128 的倍數
  num_updates_per_batch: 4
  unroll_length: 20
  learning_rate: 0.0003
  entropy_cost: 0.01
  discounting: 0.97
  reward_scaling: 1.0
  max_grad_norm: 1.0
  normalize_observations: true
  num_resets_per_eval: 0
  action_repeat: 1
  network:
    policy_hidden_layer_sizes: [512, 256, 128]
    value_hidden_layer_sizes: [512, 256, 128]
    policy_obs_key: state
    value_obs_key: privileged_state
