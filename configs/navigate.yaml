# 任務三：導航避障（階層式）
# 先訓練好 walk，這裡的策略只負責輸出速度指令給 walk 策略。
task: navigate
seed: 0

env:
  impl: warp
  low_level_policy: runs/walk/latest   # 用哪個 walk 策略當「腳」
  episode_length: 200                  # 200 步 × 0.1 秒 = 20 秒
  command_scale: [1.0, 0.6, 1.2]       # 最大速度：前後、左右、轉向
  arena_half_size: 5.0
  goal_distance: [2.5, 4.5]
  n_obstacles: 5                       # 最多 8
  obstacles_on_path: 3                 # 幾個障礙物故意擋在路上
  n_rays: 16
  ray_max_range: 3.0
  reward_config:
    scales:
      progress: 2.0
      heading: 0.1
      reached: 10.0
      collision: -10.0
      fall: -10.0
      action_rate: -0.05
      time: -0.02

ppo:
  num_timesteps: 20000000
  num_evals: 10
  num_envs: 2048
  batch_size: 256
  num_minibatches: 16
  num_updates_per_batch: 4
  unroll_length: 20
  learning_rate: 0.0003
  entropy_cost: 0.005
  discounting: 0.99
  reward_scaling: 1.0
  max_grad_norm: 1.0
  normalize_observations: true
  num_resets_per_eval: 0
  action_repeat: 1
  network:
    policy_hidden_layer_sizes: [256, 128, 64]
    value_hidden_layer_sizes: [256, 128, 64]
    policy_obs_key: state
    value_obs_key: state
