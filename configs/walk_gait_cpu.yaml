# CPU 版 walk 第三階段：糾正走路姿勢，改成 Spot 那種「對角小跑」（trot）。
# 從 walk_cpu_fast 練好的 1.5 m/s 策略接著練：
#   python -m robodog.train configs/walk_gait_cpu.yaml --resume runs/walk/<walk_cpu_fast 的 run>
#
# 糾正前量到的步態（指令 1 m/s）：跛腳（左後腳只有 12% 的時間著地）、24% 的時間四腳騰空、每秒 4 步的碎步。
# env.gait 的說明見 robodog/envs/__init__.py 的 GaitShaping。
task: walk
seed: 5
domain_randomization: false

env:
  impl: jax
  gait:
    trot: 1.0                 # 對角腳同步、兩組輪流
    flight: 1.0               # 不要四腳同時離地
    short_swing: 0.3          # 不要碎步
    swing_time: 0.2           # 每一步騰空至少 0.2 秒（約每秒 2.5 步）
  command_config:
    a: [1.5, 0.8, 1.2]        # PRD 的完整範圍（和 walk.yaml 相同）
  reward_config:
    scales:                   # 和 walk_cpu.yaml 相同
      tracking_lin_vel: 2.0
      tracking_ang_vel: 1.0
      pose: 0.1
      feet_air_time: 0.5
      feet_clearance: -0.5
      energy: -0.0005

ppo:
  num_timesteps: 10000000
  num_evals: 6
  num_envs: 256
  num_eval_envs: 64
  batch_size: 256
  num_minibatches: 8
  num_updates_per_batch: 4
  unroll_length: 20
  learning_rate: 0.0002       # 接續訓練，學習率小一點，避免把已學會的忘掉
  entropy_cost: 0.005
  discounting: 0.97
  reward_scaling: 1.0
  max_grad_norm: 1.0
  normalize_observations: true
  num_resets_per_eval: 0
  action_repeat: 1
  network:
    policy_hidden_layer_sizes: [512, 256, 128]
    value_hidden_layer_sizes: [512, 256, 128]
    policy_obs_key: state
    value_obs_key: privileged_state
