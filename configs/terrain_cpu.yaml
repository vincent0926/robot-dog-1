# CPU 版樓梯與斜坡：雲端驗證學得動不動用。從崎嶇地形練好的策略接著練，難度先只到 3（每階 6.2cm，基準線在這裡開始過不去）。
#   python -m robodog.train configs/terrain_cpu.yaml --name cloud-cpu --resume runs/rough/<崎嶇地形的 run>
task: terrain
seed: 6
domain_randomization: false

env:
  impl: jax
  gait:                       # 沿用小跑獎勵；樓梯需要不同的落腳時機，所以比 rough 的 3.0 放鬆一些
    trot: 2.0
    flight: 1.0
    short_swing: 0.3
    swing_time: 0.2
  fall_penalty: 3.0
  episode_length: 1000
  terrain:
    max_level: 3
  command_config:
    a: [1.0, 0.5, 1.0]        # 樓梯上不需要跑那麼快
  pert_config:
    enable: true
    velocity_kick: [0.0, 1.0]
    kick_durations: [0.05, 0.2]
    kick_wait_times: [1.0, 3.0]
  reward_config:
    scales:
      tracking_lin_vel: 2.0
      tracking_ang_vel: 1.0
      pose: 0.1
      feet_air_time: 0.5
      feet_clearance: -2.0    # 這個版本算的是「離地面多高」（terrain.py 覆寫過），爬樓梯要把腳抬高
      energy: -0.0005

ppo:
  num_timesteps: 6000000
  num_evals: 6
  num_envs: 256
  num_eval_envs: 64
  batch_size: 256
  num_minibatches: 8
  num_updates_per_batch: 4
  unroll_length: 20
  learning_rate: 0.0002
  entropy_cost: 0.01
  discounting: 0.99
  reward_scaling: 1.0
  max_grad_norm: 1.0
  normalize_observations: true
  num_resets_per_eval: 0
  action_repeat: 1
  network:
    policy_hidden_layer_sizes: [512, 256, 128]
    value_hidden_layer_sizes: [512, 256, 128]
    policy_obs_key: state
    value_obs_key: privileged_state
