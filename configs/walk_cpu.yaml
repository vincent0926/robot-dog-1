# 沒有 GPU 時的 walk 訓練（例如雲端 4 核 CPU）。
# 用法：python -m robodog.train configs/walk.yaml --smoke 是「測程式」，
#       這個檔案是「真的想在 CPU 上學出東西」的縮小版：
#   python -m robodog.train configs/walk_cpu.yaml
# 4 核 CPU 約 3,700 steps/s，2,000 萬步約 1.5～2 小時。品質不如 GPU 版的 1 億步。
task: walk
seed: 0
domain_randomization: false   # CPU 版先關掉，學得比較快

env:
  impl: jax                   # CPU 只能用 jax 實作

ppo:
  num_timesteps: 20000000
  num_evals: 10
  num_envs: 256
  num_eval_envs: 64
  batch_size: 256
  num_minibatches: 8          # 256 × 8 = 2048，是 256 的倍數
  num_updates_per_batch: 4
  unroll_length: 20
  learning_rate: 0.0003
  entropy_cost: 0.01
  discounting: 0.97
  reward_scaling: 1.0
  max_grad_norm: 1.0
  normalize_observations: true
  num_resets_per_eval: 0
  action_repeat: 1
  network:
    policy_hidden_layer_sizes: [512, 256, 128]
    value_hidden_layer_sizes: [512, 256, 128]
    policy_obs_key: state
    value_obs_key: privileged_state
